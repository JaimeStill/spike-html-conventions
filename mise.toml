[tools]
# Biome, the lint and format comparison's setup A, for the measure task only.
biome = "2.5.15"
bun = "1.4.3"
node = "26.12.0"
# npm 12, its own pin: node 26.12.0 bundles npm 11.20.0, from before npm 12 refused git dependencies by default.
npm = "12.2.1"
pnpm = "12.14.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
"npm:esbuild" = "0.28.2"
# Vite through mise's npm: backend; its vite runs on the pinned node.
"npm:vite" = "8.3.4"
# The lint and format comparison's other setups' tools, for the measure task only. The check's
# ESLint and Prettier are devDependencies in package.json, run from node_modules.
"npm:oxlint" = "1.88.0"
"npm:oxfmt" = "0.73.0"
"aqua:sharkdp/hyperfine" = "2.0.0"

# The browser tier's browser, in the check and in measure's raw-pipe and like-for-like Playwright
# rows: Chrome for Testing's chrome-headless-shell, one generic linux64 zip, the same build here
# and in CI. Chrome for Testing publishes no checksums, so the sha256 and size are ours, taken
# from the download by hand at each bump; mise refuses a download that doesn't match. Its latest
# is the Stable channel of Chrome for Testing's last-known-good versions, which mise outdated, and
# so mise run currency, compares the pin against.
[tools."http:chrome-headless-shell"]
version = "155.0.8059.84"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:a5d71b91aa996fef00517cd212b2dfb816b43055edefbe727e6fd562d4ae1f9c", size = "125033980" }

[tasks.check]
description = "Lint (ESLint, with the layer direction), format-check (Prettier), type-check, and test the sources (the unit tier under node --test and bun test; the browser tier, the components' probe and restyle cases in each version over Vite's dev server, through the raw Chromium debugging pipe on the pinned chrome-headless-shell, under node --test), and install the three consumer fixtures offline; reads no network, writes nothing"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
# Lit and the lint tooling, ESLint and Prettier with their plugins, come from node_modules,
# installed once outside the check (mise run install), so the check itself never reads the
# network.
if [ ! -d node_modules/lit ]; then
  echo "check: lit isn't installed; run mise run install first" >&2
  exit 1
fi
if [ ! -x node_modules/.bin/eslint ] || [ ! -x node_modules/.bin/prettier ]; then
  echo "check: the lint tooling (devDependencies) isn't installed; run mise run install first" >&2
  exit 1
fi
# The browser tier's browser, the chrome-headless-shell pin in [tools] above, by its path. mise
# which fails when the pin isn't installed, so that is named here, with the fix, rather than left
# to mise's message.
if ! headless_shell=$(mise which chrome-headless-shell 2>/dev/null); then
  echo "check: chrome-headless-shell (mise.toml's pin) isn't installed; run mise run install first" >&2
  exit 1
fi
# The shell must report the version pinned, read from mise itself. mise's download cache is keyed
# by checksum, so a version bumped without its new sha256 installs the cached old build under the
# new version's name; this fails it.
shell_pin=$(mise ls --local --json http:chrome-headless-shell \
  | node -e 'console.log(JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0]?.requested_version ?? "")')
shell_version=$("$headless_shell" --version)
case "$shell_version" in
  *" $shell_pin") ;;
  *)
    echo "check: $headless_shell reports $shell_version, but mise.toml pins chrome-headless-shell $shell_pin; give the pin its own sha256 and size" >&2
    exit 1
    ;;
esac
# The project's own copies, by pnpm exec: eslint.config.js holds the lint rules and the layer
# table, .prettierrc.json the format, and .prettierignore limits Prettier to the code, the JSON,
# and the CSS.
pnpm exec eslint .
pnpm exec prettier --check .
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
# Type-check the .ts and JSDoc forms (tsconfig.json); plain .js and the tests are outside it.
tsc --noEmit -p .
# The unit tier: one shared suite over all three forms, under each runner.
node --test test/
bun test ./test/
# The browser tier, under node --test alone: scripts/browser.test.js, outside test/ so bun test
# never runs it, through the raw pipe (scripts/browser-pipe.js, no package) on the pinned
# chrome-headless-shell, Chromium alone. The run serves the pages from Vite's dev server (the
# mise-pinned vite, with scripts/css-sheets.js) in a scratch directory of its own in TMPDIR,
# removed after; the driver fails naming the fix when the executable it is given is missing.
BROWSER_DRIVER=pipe BROWSER_EXECUTABLE="$headless_shell" node --test scripts/browser.test.js
# Each consumer fixture installs this package and spike-html-design by git tag, offline, from
# local repositories, with lit from the managers' caches (mise run install warms them): pnpm,
# npm, and bun.
scripts/consumers.sh
'''

[tasks.install]
description = "Install every mise.toml pin (mise install: the check's browser, chrome-headless-shell, with the rest; each skipped when it's already installed), lit and the lint tooling (the devDependencies: ESLint, Prettier, and their plugins) from the lockfile with pnpm, and warm pnpm's, npm's, and bun's caches with lit for the check's offline fixture installs; reads the network"
run = [
  "mise install",
  "pnpm install --frozen-lockfile",
  "scripts/consumers.sh warm",
]
dir = "{{config_root}}"

[tasks."build:tsc"]
description = "Emit the pagination element's .ts and JSDoc forms as unbundled ESM with declarations, to dist/tsc"
run = "scripts/build.sh tsc"
dir = "{{config_root}}"

[tasks."build:esbuild"]
description = "Bundle each element in each form, Lit included, with esbuild, to dist/esbuild"
run = "scripts/build.sh esbuild"
dir = "{{config_root}}"

[tasks."build:bun"]
description = "Bundle each element in each form, Lit included, with bun build, to dist/bun"
run = "scripts/build.sh bun"
dir = "{{config_root}}"

[tasks.build]
description = "Every build of the pagination element: tsc emit of its typed forms, and its bundles by esbuild and by bun build"
depends = ["build:tsc", "build:esbuild", "build:bun"]

[tasks.demo]
description = "Render every build of the frozen pagination element (bundled by esbuild and by bun build, tsc's emit, and the JS forms as written) in headless Chromium from file://; reads no network"
depends = ["build"]
run = "scripts/demo.sh"
dir = "{{config_root}}"

[tasks.preview]
description = "Serve the components layer's four versions side by side on one page, each wired to the fixture as a host application would wire it (demo/preview.ts), under Vite's dev server with scripts/css-sheets.js, printing the URL and running until Ctrl-C; reads no network, writes nothing to the working tree"
run = "scripts/preview.sh"
dir = "{{config_root}}"

[tasks.measure]
description = "Record each mise tool's installed size and each TypeScript form's lines and brotli bytes, time each toolchain with hyperfine (Node: pnpm installs and npm installs in its hoisted and linked layouts, tsc, esbuild, and Vite; Bun: bun install and bun build), and record every row, the layout rows (phantom dependencies, lockfile determinism, and disk sharing under npm, pnpm, and bun) and the GitHub and jsDelivr ones for v0.1.0 once it is released, record what each version of the components layer serves (the pagination alone and the composition, under Vite's dev server and from vite build, Lit's share apart), run the components' browser cases (the probe's in each version and the restyle check) on pages Vite's dev server serves, through the raw Chromium debugging pipe on the pinned chrome-headless-shell and through playwright-core (installed into scratch, with its browsers) on that pin, its own Chromium Headless Shell, and its Firefox, and the probe on tsc's unbundled emit over plain http in Chromium and Firefox, with Playwright's overhead over the raw pipe (footprint, download bytes and time, pins added, harness lines, cold and warm timings, and a 20-run repeat per driver), and compare four lint and format setups over the code and JSON, their content scope against the check's code, JSON, and CSS (Biome; the check's own, ESLint with typescript-eslint and eslint-plugin-boundaries and Prettier, from the devDependencies; oxlint and oxfmt; ESLint with ESLint Stylistic and eslint-plugin-jsonc: footprint, timings, leaving the formatting unchanged and restoring it from a disturbed copy, content scope, the layer rules, and surface), as a dated markdown report on stdout; reads the network, writes nothing to the working tree"
run = "scripts/measure.sh"
dir = "{{config_root}}"

[tasks.currency]
description = "Report every mise tool, package dependency, devDependency (pnpm outdated; typescript against typescript-eslint's peer range), github: tag dependency, and package measure installs into scratch pinned behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
