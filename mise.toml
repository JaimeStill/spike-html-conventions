[tools]
# Biome, the lint and format comparison's setup A, for the measure task only.
biome = "2.5.15"
bun = "1.4.3"
node = "26.12.0"
# npm 12, its own pin: node 26.12.0 bundles npm 11.20.0, from before npm 12 refused git dependencies by default.
npm = "12.2.1"
pnpm = "12.14.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
"npm:esbuild" = "0.28.2"
# Vite through mise's npm: backend; its vite runs on the pinned node.
"npm:vite" = "8.3.4"
# The lint and format comparison's other setups' tools, for the measure task only. The check's
# ESLint and Prettier are devDependencies in package.json, run from node_modules.
"npm:oxlint" = "1.88.0"
"npm:oxfmt" = "0.73.0"
"aqua:sharkdp/hyperfine" = "2.0.0"

[env]
# Playwright's browsers for the check's browser tier, the repository's own, outside the tree:
# mise run install downloads Firefox there, and the check reads it offline. Never Playwright's
# shared default, ~/.cache/ms-playwright, which holds other projects' browsers; measure names a
# directory in its own scratch instead.
PLAYWRIGHT_BROWSERS_PATH = "{{env.HOME}}/.cache/spike-html-conventions/playwright"

[tasks.check]
description = "Lint (ESLint, with the layer direction), format-check (Prettier), type-check, and test the sources (the unit tier under node --test and bun test; the browser tier, the components' probe and restyle cases in each version over Vite's dev server, through Playwright on the system Chromium and on Firefox, under node --test), and install the three consumer fixtures offline; reads no network, writes nothing"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
# Lit and the lint tooling, ESLint and Prettier with their plugins, come from node_modules,
# installed once outside the check (mise run install), so the check itself never reads the
# network.
if [ ! -d node_modules/lit ]; then
  echo "check: lit isn't installed; run mise run install first" >&2
  exit 1
fi
if [ ! -x node_modules/.bin/eslint ] || [ ! -x node_modules/.bin/prettier ] \
  || [ ! -d node_modules/playwright-core ]; then
  echo "check: the devDependencies (the lint tooling and playwright-core) aren't installed; run mise run install first" >&2
  exit 1
fi
# The project's own copies, by pnpm exec: eslint.config.js holds the lint rules and the layer
# table, .prettierrc.json the format, and .prettierignore limits Prettier to the code, the JSON,
# and the CSS.
pnpm exec eslint .
pnpm exec prettier --check .
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
# Type-check the .ts and JSDoc forms (tsconfig.json); plain .js and the tests are outside it.
tsc --noEmit -p .
# The unit tier: one shared suite over all three forms, under each runner.
node --test test/
bun test ./test/
# The browser tier, under node --test alone: scripts/browser.test.js, outside test/ so bun test
# never runs it, through Playwright on each engine. Each run serves the pages from Vite's dev
# server (the mise-pinned vite, with scripts/css-sheets.js) in a scratch directory of its own in
# TMPDIR, removed after; Firefox comes from PLAYWRIGHT_BROWSERS_PATH ([env] above), which mise run
# install fills, and the driver fails naming that when an engine's browser is missing.
for engine in chromium-system firefox; do
  BROWSER_DRIVER=playwright BROWSER_ENGINE=$engine node --test scripts/browser.test.js
done
# Each consumer fixture installs this package and spike-html-design by git tag, offline, from
# local repositories, with lit from the managers' caches (mise run install warms them): pnpm,
# npm, and bun.
scripts/consumers.sh
'''

[tasks.install]
description = "Install lit and the devDependencies (the lint tooling, ESLint, Prettier, and their plugins, and playwright-core) from the lockfile with pnpm, download Playwright's Firefox into PLAYWRIGHT_BROWSERS_PATH for the check's browser tier (skipped when it's already there), and warm pnpm's, npm's, and bun's caches with lit for the check's offline fixture installs; reads the network"
# Firefox alone: the browser tier's Chromium is the system's, through executablePath.
run = [
  "pnpm install --frozen-lockfile",
  "pnpm exec playwright-core install firefox",
  "scripts/consumers.sh warm",
]
dir = "{{config_root}}"

[tasks."build:tsc"]
description = "Emit the .ts and JSDoc forms as unbundled ESM with declarations, and the components layer and the demo's modules, with every .css in layers/ copied to its path beside them (the components' stylesheets and the foundation's baseline), to dist/tsc"
run = "scripts/build.sh tsc"
dir = "{{config_root}}"

[tasks."build:esbuild"]
description = "Bundle each element in each form, Lit included, with esbuild, to dist/esbuild"
run = "scripts/build.sh esbuild"
dir = "{{config_root}}"

[tasks."build:bun"]
description = "Bundle each element in each form, Lit included, with bun build, to dist/bun"
run = "scripts/build.sh bun"
dir = "{{config_root}}"

[tasks.build]
description = "Every build: tsc emit (the pagination element's forms, the components layer, and the demo's modules), and the pagination element bundled by esbuild and by bun build"
depends = ["build:tsc", "build:esbuild", "build:bun"]

[tasks.demo]
description = "Render every build of the frozen pagination element (bundled by esbuild and by bun build, tsc's emit, and the JS forms as written) in headless Chromium from file://; reads no network"
depends = ["build"]
run = "scripts/demo.sh"
dir = "{{config_root}}"

[tasks.preview]
description = "Serve the components layer's four versions side by side on one page, each wired to the fixture as a host application would wire it (demo/preview.ts), under Vite's dev server with scripts/css-sheets.js, printing the URL and running until Ctrl-C; reads no network, writes nothing to the working tree"
run = "scripts/preview.sh"
dir = "{{config_root}}"

[tasks.measure]
description = "Record each mise tool's installed size and each TypeScript form's lines and brotli bytes, time each toolchain with hyperfine (Node: pnpm installs and npm installs in its hoisted and linked layouts, tsc, esbuild, and Vite; Bun: bun install and bun build), and record every row, the layout rows (phantom dependencies, lockfile determinism, and disk sharing under npm, pnpm, and bun) and the GitHub and jsDelivr ones for v0.1.0 once it is released, record what each version of the components layer serves (the pagination alone and the composition, under Vite's dev server and from vite build, Lit's share apart), run the components' browser cases (the probe's in each version and the restyle check) on pages Vite's dev server serves, through the raw Chromium debugging pipe and through playwright-core (the devDependency, its browsers downloaded into scratch) on the system Chromium, Chromium Headless Shell, and Firefox, and the probe on tsc's unbundled emit over plain http in Chromium and Firefox, with Playwright's overhead over the raw pipe (footprint, download bytes and time, pins added, harness lines, cold and warm timings, and a 20-run repeat per driver), and compare four lint and format setups over the code and JSON, their content scope against the check's code, JSON, and CSS (Biome; the check's own, ESLint with typescript-eslint and eslint-plugin-boundaries and Prettier, from the devDependencies; oxlint and oxfmt; ESLint with ESLint Stylistic and eslint-plugin-jsonc: footprint, timings, leaving the formatting unchanged and restoring it from a disturbed copy, content scope, the layer rules, and surface), as a dated markdown report on stdout; reads the network, writes nothing to the working tree"
run = "scripts/measure.sh"
dir = "{{config_root}}"

[tasks.currency]
description = "Report every mise tool, package dependency, devDependency (pnpm outdated; typescript against typescript-eslint's peer range), github: tag dependency, and package measure installs into scratch pinned behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "scripts/currency.sh"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
